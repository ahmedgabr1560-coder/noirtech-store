<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NEXORA | إضافة منتج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#050505; --card:#121218; --border:rgba(255,255,255,.1); --text:#f5f5f7; --muted:#9a9aa3; --accent:#a78bfa; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Cairo",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 14px 48px; }
    .wrap { width:min(560px,100%); margin:0 auto; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    .mark { width:40px; height:40px; border-radius:12px; background:#fff; color:#000; display:grid; place-items:center; font-weight:900; font-size:.75rem; }
    h1 { font-size:1.3rem; font-weight:800; }
    .sub { color:var(--muted); font-size:.86rem; margin-top:3px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:14px; }
    label { display:grid; gap:6px; margin-bottom:12px; font-size:.84rem; font-weight:600; color:var(--muted); }
    input, select, textarea {
      width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.04); color:var(--text); font-family:inherit; font-size:.95rem; outline:none;
    }
    input:focus, select:focus, textarea:focus { border-color:rgba(167,139,250,.5); }
    textarea { min-height:80px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .btn {
      width:100%; padding:14px; border:0; border-radius:999px; font-weight:800; font-size:.95rem;
      cursor:pointer; font-family:inherit; background:#fff; color:#000; margin-top:6px;
    }
    .btn:disabled { opacity:.55; cursor:wait; }
    .btn-ghost { background:transparent; border:1px solid var(--border); color:#fff; margin-top:10px; }
    .msg { margin-top:12px; padding:12px 14px; border-radius:12px; font-size:.9rem; display:none; }
    .msg.ok { display:block; background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); color:#86efac; }
    .msg.err { display:block; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
    .lock { text-align:center; padding:28px 12px; }
    .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
    .links a { color:var(--accent); font-size:.86rem; font-weight:600; text-decoration:none; }

    .photo-box {
      border:1.5px dashed rgba(255,255,255,.18); border-radius:16px; padding:16px;
      text-align:center; background:rgba(255,255,255,.03); margin-bottom:14px;
    }
    .photo-box.has-img { border-style:solid; border-color:rgba(167,139,250,.35); }
    .photo-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
    .photo-btn {
      display:inline-flex; align-items:center; gap:6px; padding:10px 14px; border-radius:999px;
      border:1px solid var(--border); background:rgba(255,255,255,.06); color:#fff;
      font-weight:700; font-size:.84rem; cursor:pointer; font-family:inherit;
    }
    .preview {
      width:100%; max-height:220px; object-fit:contain; border-radius:12px;
      background:rgba(0,0,0,.35); display:none; margin:0 auto;
    }
    .preview.on { display:block; }
    .hint { font-size:.78rem; color:var(--muted); margin-top:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">NX</div>
      <div>
        <h1>إضافة منتج</h1>
        <p class="sub">ارفع صورة من الموبايل أو أكتب رابط</p>
      </div>
    </div>

    <div class="card" id="lockCard">
      <div class="lock">
        <h2>🔐 دخول الإدارة</h2>
        <p class="sub" style="margin-bottom:14px">كلمة سر الإدارة</p>
        <label>كلمة السر
          <input type="password" id="secretInput" placeholder="••••••••" />
        </label>
        <button class="btn" type="button" id="unlockBtn">دخول</button>
        <div class="msg" id="lockMsg"></div>
      </div>
    </div>

    <form class="card" id="productForm" style="display:none">
      <label>اسم المنتج *
        <input type="text" id="name" required placeholder="مثال: Samsung Galaxy A36" />
      </label>
      <div class="row">
        <label>السعر (ج.م) *
          <input type="number" id="price" required min="1" placeholder="25000" inputmode="numeric" />
        </label>
        <label>قبل الخصم
          <input type="number" id="oldPrice" min="1" placeholder="اختياري" inputmode="numeric" />
        </label>
      </div>
      <div class="row">
        <label>القسم *
          <select id="category">
            <option value="phones">📱 موبايلات</option>
            <option value="laptops">💻 لابتوبات</option>
            <option value="monitors">🖥️ شاشات</option>
            <option value="home">🏠 منزلية</option>
            <option value="accessories">🎧 إكسسوارات</option>
          </select>
        </label>
        <label>شارة
          <input type="text" id="badge" value="جديد" />
        </label>
      </div>

      <div class="photo-box" id="photoBox">
        <img class="preview" id="imgPreview" alt="معاينة الصورة" />
        <p id="photoLabel" style="font-weight:700;color:#eee">📷 صورة المنتج</p>
        <p class="hint">من الكاميرا أو الاستوديو — أو رابط صورة</p>
        <div class="photo-actions">
          <label class="photo-btn">
            📁 من المعرض
            <input type="file" id="fileGallery" accept="image/*" hidden />
          </label>
          <label class="photo-btn">
            📸 كاميرا
            <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden />
          </label>
          <button type="button" class="photo-btn" id="clearPhoto" style="display:none">🗑 إزالة</button>
        </div>
      </div>

      <label>أو رابط صورة
        <input type="url" id="image" placeholder="https://..." inputmode="url" />
      </label>
      <label>الوصف
        <textarea id="description" placeholder="وصف قصير..."></textarea>
      </label>
      <button class="btn" type="submit" id="submitBtn">➕ إضافة المنتج ونشره</button>
      <p class="hint" style="text-align:center;margin-top:10px">النشر تلقائي — المنتج يظهر على الموقع مباشرة بدون أي خطوة إضافية</p>
      <button class="btn btn-ghost" type="button" id="logoutBtn">تسجيل الخروج</button>
      <div class="msg" id="formMsg"></div>
      <div class="links">
        <a href="/" target="_blank">🌐 المتجر</a>
        <a href="https://t.me/tacnoahmrd55_bot" target="_blank">🤖 البوت</a>
      </div>
    </form>
  </div>
  <script>
    const SECRET_KEY = "nx_admin_secret";
    const form = document.getElementById("productForm");
    const lockCard = document.getElementById("lockCard");
    const formMsg = document.getElementById("formMsg");
    const lockMsg = document.getElementById("lockMsg");
    const imgPreview = document.getElementById("imgPreview");
    const photoBox = document.getElementById("photoBox");
    const photoLabel = document.getElementById("photoLabel");
    const clearPhoto = document.getElementById("clearPhoto");
    let imageBase64 = null;

    function showForm() {
      lockCard.style.display = "none";
      form.style.display = "block";
    }
    if (localStorage.getItem(SECRET_KEY)) showForm();

    document.getElementById("unlockBtn").onclick = () => {
      const s = document.getElementById("secretInput").value.trim();
      if (!s) { lockMsg.className = "msg err"; lockMsg.textContent = "اكتب كلمة السر"; return; }
      localStorage.setItem(SECRET_KEY, s);
      showForm();
    };
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem(SECRET_KEY);
      location.reload();
    };

    function setPreview(src) {
      imgPreview.src = src;
      imgPreview.classList.add("on");
      photoBox.classList.add("has-img");
      photoLabel.style.display = "none";
      clearPhoto.style.display = "inline-flex";
    }
    function resetPhoto() {
      imageBase64 = null;
      imgPreview.src = "";
      imgPreview.classList.remove("on");
      photoBox.classList.remove("has-img");
      photoLabel.style.display = "block";
      clearPhoto.style.display = "none";
      document.getElementById("fileGallery").value = "";
      document.getElementById("fileCamera").value = "";
    }
    clearPhoto.onclick = resetPhoto;

    document.getElementById("image").addEventListener("input", (e) => {
      const v = e.target.value.trim();
      if (/^https?:\/\//i.test(v)) {
        imageBase64 = null;
        setPreview(v);
      }
    });

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) return reject(new Error("اختر صورة"));
        if (file.size > 8 * 1024 * 1024) return reject(new Error("الصورة أكبر من 8MB"));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("تعذر قراءة الصورة"));
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 1000;
            let w = img.width, h = img.height;
            if (w > max || h > max) {
              const r = Math.min(max / w, max / h);
              w = Math.round(w * r);
              h = Math.round(h * r);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error("صورة غير صالحة"));
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function onFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        formMsg.className = "msg";
        formMsg.textContent = "";
        const dataUrl = await compressImage(file);
        imageBase64 = dataUrl;
        document.getElementById("image").value = "";
        setPreview(dataUrl);
      } catch (err) {
        formMsg.className = "msg err";
        formMsg.textContent = "❌ " + err.message;
      }
    }
    document.getElementById("fileGallery").addEventListener("change", onFile);
    document.getElementById("fileCamera").addEventListener("change", onFile);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      formMsg.className = "msg";
      formMsg.textContent = "";
      btn.disabled = true;
      btn.textContent = "جاري النشر...";
      try {
        const payload = {
          secret: localStorage.getItem(SECRET_KEY),
          name: document.getElementById("name").value.trim(),
          price: document.getElementById("price").value,
          oldPrice: document.getElementById("oldPrice").value || null,
          category: document.getElementById("category").value,
          badge: document.getElementById("badge").value.trim() || "جديد",
          image: document.getElementById("image").value.trim(),
          imageBase64: imageBase64,
          description: document.getElementById("description").value.trim()
        };
        const r = await fetch("/api/product", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          if (r.status === 401) localStorage.removeItem(SECRET_KEY);
          throw new Error(data.error || "فشل الإضافة");
        }
        formMsg.className = "msg ok";
        formMsg.textContent = "✅ تم النشر فورًا #" + data.product.id + " — " + data.product.name + " | الإجمالي: " + data.total + " | ظاهر على الموقع خلال ثواني";
        form.reset();
        document.getElementById("badge").value = "جديد";
        resetPhoto();
      } catch (err) {
        formMsg.className = "msg err";
        formMsg.textContent = "❌ " + (err.message || "حصل خطأ");
      } finally {
        btn.disabled = false;
        btn.textContent = "➕ إضافة المنتج ونشره";
      }
    });
  </script>
</body>
</html>
