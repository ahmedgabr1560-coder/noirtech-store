<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="شاركينا رأيك في تجربة التسوق من ATHAR | أَثَر." />
  <title>رأيك يهمنا | ATHAR</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root { color-scheme: dark; --bg:#07070a; --muted:#9898a6; }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
    a { color:inherit; }
    .logo { display:inline-flex; align-items:center; gap:9px; color:#fff; text-decoration:none; font-weight:900; letter-spacing:.04em; }
    .logo-mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.22); border-radius:11px; font-size:.68rem; }
    .logo-text { font-size:.9rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 28px; border:1px solid transparent; border-radius:999px; font:700 .92rem inherit; cursor:pointer; transition:.2s; }
    .btn:disabled { opacity:.6; cursor:wait; }
    .btn-primary { background:#fff; color:#000; box-shadow:0 8px 30px rgba(255,255,255,.1); }
    .btn-block { width:100%; }
    body.feedback-page { min-height:100vh; background:radial-gradient(circle at 15% 10%, rgba(124,92,255,.18), transparent 34%), var(--bg); }
    .feedback-shell { width: min(100% - 32px, 720px); margin: 0 auto; padding: 24px 0 56px; }
    .feedback-top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:42px; }
    .feedback-back { color:#bdb8d8; text-decoration:none; font-size:.88rem; }
    .feedback-back:hover { color:#fff; }
    .feedback-card { padding: clamp(24px, 5vw, 48px); border:1px solid rgba(255,255,255,.12); border-radius:28px; background:linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025)); box-shadow:0 28px 80px rgba(0,0,0,.35); }
    .feedback-kicker { color:#e8d5a3; font-size:.8rem; font-weight:800; letter-spacing:.04em; margin:0 0 12px; }
    .feedback-card h1 { margin:0 0 12px; font-size:clamp(2rem, 6vw, 3.2rem); line-height:1.1; color:#fff; }
    .feedback-intro { color:var(--muted); line-height:1.8; margin:0 0 28px; }
    .feedback-form { display:grid; gap:16px; }
    .feedback-form label { display:grid; gap:8px; color:#eeeef5; font-size:.9rem; font-weight:700; }
    .feedback-form input, .feedback-form textarea, .feedback-form select { width:100%; border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(0,0,0,.22); color:#fff; padding:13px 14px; font:inherit; outline:none; }
    .feedback-form textarea { min-height:140px; resize:vertical; }
    .feedback-form input:focus, .feedback-form textarea:focus, .feedback-form select:focus { border-color:#7a1f3d; box-shadow:0 0 0 3px rgba(167,139,250,.12); }
    .feedback-rating { display:flex; flex-wrap:wrap; gap:8px; direction:rtl; }
    .feedback-rating input { position:absolute; opacity:0; pointer-events:none; }
    .feedback-rating label { display:inline-flex; width:48px; height:44px; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.14); border-radius:12px; color:#777484; font-size:1.45rem; cursor:pointer; transition:.2s; }
    .feedback-rating label:hover, .feedback-rating input:checked + label { color:#ffd666; border-color:#ffd666; background:rgba(240,180,41,.1); transform:translateY(-1px); }
    .feedback-hint { color:#8f8d9d; font-size:.78rem; margin:0; }
    .feedback-status { min-height:24px; color:#e8d5a3; font-size:.88rem; font-weight:700; }
    .feedback-status.error { color:#fca5a5; }
    .feedback-privacy { color:#858391; font-size:.75rem; line-height:1.7; margin:0; }
    .feedback-brand { color:#fff; font-weight:900; letter-spacing:.04em; }
    @media (max-width:520px) { .feedback-shell { width:min(100% - 22px, 720px); } .feedback-top { margin-bottom:28px; } .feedback-card { border-radius:22px; padding:24px 18px; } }

    /* ATHAR brand palette */
    :root { --bg:#07060a; --muted:#b8a99a; --burgundy:#7a1f3d; --gold:#d4af37; --gold-light:#f0d78c; }
    body.feedback-page { background:radial-gradient(circle at 15% 10%, rgba(122,31,61,.34), transparent 34%), var(--bg); color:#f5efe8; }
    .logo-mark { border-color:rgba(212,175,55,.55); color:var(--gold-light); background:rgba(122,31,61,.2); }
    .feedback-back { color:#e8d5a3; }
    .feedback-back:hover { color:#fff8f0; }
    .feedback-card { border-color:rgba(212,175,55,.32); background:linear-gradient(145deg,rgba(20,16,24,.98),rgba(12,10,16,.98)); box-shadow:0 28px 80px rgba(0,0,0,.45); }
    .feedback-kicker,.feedback-status { color:var(--gold-light); }
    .feedback-card h1 { color:#fff8f0; }
    .feedback-intro { color:#b8a99a; }
    .feedback-form label { color:#f5efe8; }
    .feedback-form input,.feedback-form textarea,.feedback-form select { border-color:rgba(212,175,55,.24); background:#121018; color:#f5efe8; }
    .feedback-form input:focus,.feedback-form textarea:focus,.feedback-form select:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.14); }
    .feedback-rating label { border-color:rgba(212,175,55,.24); color:#8f8177; }
    .feedback-rating label:hover,.feedback-rating input:checked + label { color:var(--gold-light); border-color:var(--gold); background:rgba(122,31,61,.22); }
    .feedback-hint,.feedback-privacy { color:#a99588; }
    .feedback-form .btn-primary { background:linear-gradient(135deg,#7a1f3d,#9a284e); color:#fff8f0; border:0; box-shadow:0 10px 28px rgba(122,31,61,.3); }
    .feedback-form .btn-primary:hover { background:linear-gradient(135deg,#9a284e,#b63460); }
    #feedbackThemeToggle { border:1px solid rgba(212,175,55,.45); color:#f0d78c; background:rgba(122,31,61,.2); border-radius:999px; padding:8px 10px; cursor:pointer; font:700 .8rem system-ui,sans-serif; }
    [data-theme="light"] body.feedback-page { background:radial-gradient(circle at 15% 10%,rgba(122,31,61,.14),transparent 34%),#fce8ef; color:#3b1224; }
    [data-theme="light"] .feedback-card { background:linear-gradient(145deg,#fff,#fff5f8); border-color:rgba(122,31,61,.16); box-shadow:0 28px 80px rgba(122,31,61,.12); }
    [data-theme="light"] .feedback-card h1,[data-theme="light"] .feedback-form label { color:#3b1224; }
    [data-theme="light"] .feedback-intro { color:#7d5363; }
    [data-theme="light"] .feedback-form input,[data-theme="light"] .feedback-form textarea,[data-theme="light"] .feedback-form select { background:#fff; color:#3b1224; border-color:#f0d4de; }
    [data-theme="light"] .feedback-hint,[data-theme="light"] .feedback-privacy { color:#8f6978; }
  </style>
</head>
<body class="feedback-page">
  <main class="feedback-shell">
    <div class="feedback-top">
      <a class="logo" href="/"><span class="logo-mark">ATH</span><span class="logo-text">ATHAR</span></a>
      <div style="display:flex;align-items:center;gap:10px">
        <button type="button" id="feedbackThemeToggle" aria-label="تبديل المظهر">☾</button>
        <a class="feedback-back" href="/">← العودة للمتجر</a>
      </div>
    </div>
    <section class="feedback-card" aria-labelledby="feedbackTitle">
      <p class="feedback-kicker">نحن نسمعكِ</p>
      <h1 id="feedbackTitle">رأيك يهمنا</h1>
      <p class="feedback-intro">اختاري المنتج واكتبي رأيك وتقييمك. سيصل لفريقنا للمراجعة، ولن يظهر على الموقع قبل اعتماده.</p>
      <form class="feedback-form" id="feedbackForm">
        <label for="feedbackProduct">المنتج الذي تقيّمينه
          <select id="feedbackProduct" required><option value="">جاري تحميل المنتجات...</option></select>
        </label>
        <label>تقييمك للمنتج
          <span class="feedback-rating" aria-label="اختاري تقييمًا من نجمة إلى خمس نجوم">
            <input id="rating5" type="radio" name="rating" value="5" checked /><label for="rating5" aria-label="5 نجوم">★</label>
            <input id="rating4" type="radio" name="rating" value="4" /><label for="rating4" aria-label="4 نجوم">★</label>
            <input id="rating3" type="radio" name="rating" value="3" /><label for="rating3" aria-label="3 نجوم">★</label>
            <input id="rating2" type="radio" name="rating" value="2" /><label for="rating2" aria-label="نجمتان">★</label>
            <input id="rating1" type="radio" name="rating" value="1" /><label for="rating1" aria-label="نجمة واحدة">★</label>
          </span>
          <small class="feedback-hint">اختاري عدد النجوم الذي يعبّر عن تجربتك</small>
        </label>
        <label>اسمك (اختياري)
          <input id="feedbackName" type="text" maxlength="80" placeholder="مثال: سارة" autocomplete="name" />
        </label>
        <label>رأيك أو اقتراحك
          <textarea id="feedbackMessage" maxlength="1200" required placeholder="إيه أكتر حاجة عجبتك؟ وإيه ممكن نحسّنه؟"></textarea>
        </label>
        <label class="feedback-honeypot" aria-hidden="true" style="position:absolute;left:-9999px">اتركي هذا الحقل فارغًا<input id="feedbackWebsite" tabindex="-1" autocomplete="off" /></label>
        <button class="btn btn-primary btn-block" id="feedbackSubmit" type="submit">إرسال رأيي <span aria-hidden="true">←</span></button>
        <p class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></p>
        <p class="feedback-privacy">لن يظهر رأيك أو بياناتك للعامة قبل المراجعة والاعتماد. يصل التقييم واسم المنتج إلى فريق ATHAR لمتابعة الملاحظات.</p>
      </form>
    </section>
  </main>
  <script>
    (function(){
      var media=window.matchMedia("(prefers-color-scheme: dark)");
      function currentMode(){ return localStorage.getItem("nx_theme_mode")||"system"; }
      function apply(){
        var mode=currentMode();
        var dark=mode==="dark"?true:mode==="light"?false:media.matches;
        document.documentElement.setAttribute("data-theme",dark?"dark":"light");
        document.documentElement.style.colorScheme=dark?"dark":"light";
        sync();
      }
      var b=document.getElementById("feedbackThemeToggle");
      function sync(){
        var isDark=document.documentElement.getAttribute("data-theme")==="dark";
        var mode=currentMode();
        if(b){ b.textContent=isDark?"☀":"☾"; b.title=mode==="system"?"تلقائي حسب الجهاز — اضغطي للتغيير":(isDark?"الوضع الفاتح":"الوضع الداكن"); }
      }
      b&&b.addEventListener("click",function(){
        var mode=currentMode();
        localStorage.setItem("nx_theme_mode",mode==="system"?"dark":mode==="dark"?"light":"system");
        apply();
      });
      if(media.addEventListener) media.addEventListener("change",function(){ if(currentMode()==="system") apply(); });
      else if(media.addListener) media.addListener(function(){ if(currentMode()==="system") apply(); });
      apply();
    })();
    const form = document.getElementById("feedbackForm");
    const status = document.getElementById("feedbackStatus");
    const submit = document.getElementById("feedbackSubmit");
    const productSelect = document.getElementById("feedbackProduct");
    const requestedProductId = new URLSearchParams(location.search).get("productId") || "";
    async function loadFeedbackProducts() {
      const sources = ["/api/catalog?type=products", "/products.json", "https://raw.githubusercontent.com/ahmedgabr1560-coder/noirtech-store/main/products.json"];
      for (const source of sources) {
        try {
          const response = await fetch(source, { cache: "no-store" });
          if (!response.ok) continue;
          const payload = await response.json();
          const products = Array.isArray(payload) ? payload : (Array.isArray(payload.products) ? payload.products : []);
          const available = products.filter(product => product && product.hidden !== true && product.active !== false && product.id != null && product.name);
          if (!available.length) continue;
          productSelect.replaceChildren(new Option("اختاري المنتج", ""));
          available.forEach(product => productSelect.add(new Option(String(product.name), String(product.id))));
          if (requestedProductId && available.some(product => String(product.id) === String(requestedProductId))) {
            productSelect.value = String(requestedProductId);
          }
          return;
        } catch (error) {}
      }
      productSelect.replaceChildren(new Option("تعذر تحميل المنتجات — أعيدي تحميل الصفحة", ""));
    }
    loadFeedbackProducts();
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("feedbackMessage").value.trim();
      const name = document.getElementById("feedbackName").value.trim() || "بدون اسم";
      const website = document.getElementById("feedbackWebsite").value.trim();
      const rating = form.querySelector('input[name="rating"]:checked')?.value || "5";
      const productId = productSelect.value;
      const productName = productSelect.selectedOptions[0]?.textContent || "";
      if (website) return;
      if (!productId) { status.textContent = "اختاري المنتج الذي تقيّمينه"; status.className = "feedback-status error"; return; }
      if (!message) { status.textContent = "اكتبي رأيك أولًا"; status.className = "feedback-status error"; return; }
      submit.disabled = true;
      submit.textContent = "جاري الإرسال...";
      status.textContent = "";
      try {
        const response = await fetch("/api/notify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: "feedback", message: `📦 المنتج: ${productName}\n🆔 رقم المنتج: ${productId}\n⭐ التقييم: ${rating}/5\n👤 الاسم: ${name}\n📝 الرأي:\n${message}\n\n⏳ بانتظار المراجعة والاعتماد قبل النشر.` }) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error || "تعذر الإرسال");
        form.reset();
        form.querySelector('input[name="rating"][value="5"]').checked = true;
        status.textContent = "وصل تقييمك لفريقنا للمراجعة. لن يظهر على الموقع قبل اعتماده، شكرًا لمشاركتكِ ✓";
        status.className = "feedback-status";
      } catch (error) {
        status.textContent = "حصلت مشكلة بسيطة. حاولي مرة أخرى بعد قليل.";
        status.className = "feedback-status error";
      } finally {
        submit.disabled = false;
        submit.innerHTML = 'إرسال رأيي <span aria-hidden="true">←</span>';
      }
    });
  </script>
</body>
</html>
