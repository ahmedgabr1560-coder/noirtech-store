<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تفاصيل المنتج | NEXORA</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; }
    .pp-wrap { width: min(1100px, 94vw); margin: 0 auto; padding: 24px 0 60px; position: relative; z-index: 2; }
    .pp-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
    .pp-top a { color: #c4b5fd; text-decoration: none; font-weight: 700; }
    .pp-card {
      background: rgba(18,18,24,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .pp-loading, .pp-error { text-align: center; padding: 60px 16px; color: #9a9aa3; }
    .color-row { display:flex; flex-wrap:wrap; gap:10px; margin: 12px 0 8px; }
    .color-swatch {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2);
      cursor: pointer; position: relative; padding: 0; background: #333;
    }
    .color-swatch.active { outline: 2px solid #a78bfa; outline-offset: 2px; border-color: #fff; }
    .color-swatch span.label-tip {
      display:none; position:absolute; bottom:110%; right:50%; transform:translateX(50%);
      background:#111; color:#fff; font-size:.7rem; padding:4px 8px; border-radius:8px; white-space:nowrap;
    }
    .color-swatch:hover span.label-tip { display:block; }
    .color-swatch { margin-bottom: 18px; }
    .color-swatch .color-cap {
      position: absolute; bottom: -18px; right: 50%; transform: translateX(50%);
      font-size: 0.68rem; color: #b7b7c5; white-space: nowrap; font-weight: 700;
    }
    .color-swatch.active .color-cap { color: #c4b5fd; }
    .stock-row { margin: 10px 0 14px; font-size: .9rem; font-weight: 700; }
    .stock-row.in { color: #4ade80; }
    .stock-row.out { color: #f87171; }
    .stock-count { color: #c4b5fd; font-weight: 800; }
    .qty-pick { display:inline-flex; align-items:center; gap:0; border:1px solid rgba(255,255,255,.12); border-radius:12px; overflow:hidden; margin-left:8px; }
    .qty-pick button { width:36px; height:38px; border:0; background:rgba(255,255,255,.06); color:#fff; cursor:pointer; font-size:1.1rem; }
    .qty-pick input { width:44px; height:38px; border:0; background:transparent; color:#fff; text-align:center; font-weight:700; font-family:inherit; }

  </style>
</head>
<body>
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-black"></div>
    <div class="fog"></div>
  </div>
  <div class="pp-wrap">
    <div class="pp-top">
      <a href="/">← العودة للمتجر</a>
      <strong style="color:#fff">NEXORA</strong>
    </div>
    <div class="pp-card">
      <div id="ppRoot" class="pp-loading">جاري تحميل المنتج...</div>
    </div>
  </div>
  <script>
    const money = (n) => Number(n).toLocaleString("ar-EG") + " ج.م";
    const stars = (r) => {
      const n = Math.round(Number(r) || 0);
      return "★".repeat(Math.min(5, n)) + "☆".repeat(Math.max(0, 5 - Math.min(5, n)));
    };
    function esc(t) {
      return String(t || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    async function loadJSON(urls) {
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (r.ok) return await r.json();
        } catch (e) {}
      }
      return null;
    }
    function addLocalCart(p, qty) {
      const key = "nx_cart";
      let cart = [];
      try { cart = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) {}
      const id = Number(p.id);
      const color = p.selectedColor || p.color || "";
      const item = cart.find(x => Number(x.id) === id && String(x.color || "") === String(color));
      if (item) item.qty += qty;
      else cart.push({
        id, qty,
        name: p.name, price: p.price, image: p.image,
        category: p.category, description: p.description || "",
        color
      });
      localStorage.setItem(key, JSON.stringify(cart));
    }
    (async function () {
      const id = Number(new URLSearchParams(location.search).get("id") || 0);
      const root = document.getElementById("ppRoot");
      if (!id) {
        root.className = "pp-error";
        root.innerHTML = "لم يتم تحديد منتج.<br><a href='/' style='color:#c4b5fd'>العودة للمتجر</a>";
        return;
      }
      const [products, catalog] = await Promise.all([
        loadJSON([
          "https://raw.githubusercontent.com/ahmedgabr1560-coder/noirtech-store/main/products.json?t=" + Date.now(),
          "/products.json?t=" + Date.now()
        ]),
        loadJSON([
          "https://raw.githubusercontent.com/ahmedgabr1560-coder/noirtech-store/main/categories.json?t=" + Date.now(),
          "/categories.json?t=" + Date.now()
        ])
      ]);
      const list = Array.isArray(products) ? products : [];
      const p = list.find(x => Number(x.id) === id);
      if (!p) {
        root.className = "pp-error";
        root.innerHTML = "المنتج غير موجود.<br><a href='/' style='color:#c4b5fd'>العودة للمتجر</a>";
        return;
      }
      document.title = p.name + " | NEXORA";
      const cats = catalog?.categories || [];
      const cat = cats.find(c => c.id === p.category);
      const sub = cat?.subs?.find(s => s.id === p.subcategory);
      const off = p.oldPrice && p.oldPrice > p.price ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : null;
      const specs = p.specs && typeof p.specs === "object" ? p.specs : {};
      const specRows = Object.entries(specs).map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("");
      const desc = p.description || p.desc || (p.name + " — متوفر في NEXORA.");
      const related = list.filter(x => x.category === p.category && Number(x.id) !== id).slice(0, 4);

      
      root.className = "";
      const colors = Array.isArray(p.colors) ? p.colors : [];
      const stock = Math.max(0, Number(p.stock ?? p.qty ?? 0) || 0);
      let available = p.available;
      if (available === undefined || available === null) available = stock > 0;
      available = !!available && stock > 0;
      const colorBtns = colors.length
        ? colors.map((c, i) => {
            const name = typeof c === "string" ? c : (c.name || c.label || ("لون " + (i+1)));
            const code = typeof c === "string" ? "" : (c.code || c.hex || "");
            const bg = code || "#888";
            return `<button type="button" class="color-swatch" data-color="${esc(name)}" data-code="${esc(code)}" style="background:${esc(bg)}" title="${esc(name)}"><span class="color-cap">${esc(name)}</span></button>`;
          }).join("")
        : `<span style="color:#9a9aa3;font-size:.85rem">لا يوجد اختيار ألوان لهذا المنتج</span>`;

      root.innerHTML = `
        <div class="pd-layout">
          <div class="pd-gallery">
            <img class="pd-main-img" src="${p.image}" alt="${esc(p.name)}"
              onerror="this.src='https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800&h=800&fit=crop&q=70'" />
          </div>
          <div class="pd-info">
            <div class="pd-breadcrumb">
              <a href="/">المتجر</a>
              ${cat ? `<span>/</span><a href="/#shop">${esc(cat.name_ar)}</a>` : ""}
              ${sub ? `<span>/</span><span>${esc(sub.name_ar)}</span>` : ""}
            </div>
            ${p.brand ? `<div class="pd-brand">${esc(p.brand)}</div>` : ""}
            <h1 class="pd-title">${esc(p.name)}</h1>
            <div class="rating pd-rating">${stars(p.rating)} <span>(${p.reviews || 0} تقييم)</span></div>
            <div class="price-row pd-price">
              <span class="price" style="font-size:1.5rem">${money(p.price)}</span>
              ${p.oldPrice ? `<span class="old-price">${money(p.oldPrice)}</span>` : ""}
              ${off ? `<span class="badge-off" style="position:static">-${off}%</span>` : ""}
            </div>
            ${Array.isArray(p.offerMeta?.tiers) && p.offerMeta.tiers.length ? `
            <div style="margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.35);color:#fdba74;font-weight:700;line-height:1.6">
              🔥 عروض الكمية:<br>
              ${p.offerMeta.tiers.map(t => `• ${t.qty} قطع بـ ${money(t.price)}`).join("<br>")}
            </div>` : ""}
            <div class="stock-row ${available ? "in" : "out"}" id="stockRow">
              ${available
                ? `✅ متوفر حالياً — <span class="stock-count">${stock}</span> قطعة`
                : `❌ غير متوفر حالياً`}
            </div>
            <div>
              <div style="font-size:.85rem;color:#9a9aa3;margin-bottom:6px;font-weight:700">اللون</div>
              <div class="color-row" id="colorRow">${colorBtns}</div>
              <div id="selectedColorLabel" style="font-size:.82rem;color:#c4b5fd;min-height:1.2em"></div>
            </div>
            <div class="pd-desc">
              <h4>الوصف</h4>
              <p>${esc(desc)}</p>
            </div>
            ${specRows ? `<div class="pd-specs"><h4>المواصفات</h4><table>${specRows}</table></div>` : ""}
            <div class="pd-actions" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
              <div class="qty-pick">
                <button type="button" id="qtyMinus">−</button>
                <input type="number" id="buyQty" value="1" min="1" max="${Math.max(1, stock || 1)}" />
                <button type="button" id="qtyPlus">+</button>
              </div>
              <button type="button" class="btn btn-primary" id="ppAddCart" ${available ? "" : "disabled"} style="${available ? "" : "opacity:.5;cursor:not-allowed"}">
                ${available ? "أضف للسلة" : "غير متوفر"}
              </button>
              <a class="btn btn-ghost" href="/">متابعة التسوق</a>
            </div>
          </div>
        </div>
        ${related.length ? `
        <div style="margin-top:28px">
          <h3 style="color:#fff;margin-bottom:12px">منتجات مشابهة</h3>
          <div class="products-grid">${related.map(r => `
            <article class="product-card">
              <a class="product-media" href="/product.html?id=${r.id}"><img src="${r.image}" alt="" loading="lazy" /></a>
              <div class="product-body">
                <a class="product-link" href="/product.html?id=${r.id}"><strong>${esc(r.name)}</strong></a>
                <div class="price-row"><span class="price">${money(r.price)}</span></div>
              </div>
            </article>`).join("")}
          </div>
        </div>` : ""}
      `;

      let selectedColor = "";
      const selLabel = document.getElementById("selectedColorLabel");
      if (selLabel) {
        selLabel.textContent = colors.length ? "⚠️ اختاري لونًا (إجباري)" : "";
        selLabel.style.color = colors.length ? "#fbbf24" : "#c4b5fd";
      }

      document.getElementById("colorRow")?.addEventListener("click", (e) => {
        const btn = e.target.closest(".color-swatch");
        if (!btn) return;
        document.querySelectorAll(".color-swatch").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedColor = btn.getAttribute("data-color") || "";
        if (selLabel) {
          selLabel.textContent = selectedColor ? ("اللون المختار: " + selectedColor) : "⚠️ اختاري لونًا (إجباري)";
          selLabel.style.color = selectedColor ? "#c4b5fd" : "#fbbf24";
        }
      });

      const qtyInput = document.getElementById("buyQty");
      const maxQty = Math.max(1, stock || 1);
      document.getElementById("qtyMinus")?.addEventListener("click", () => {
        const v = Math.max(1, (Number(qtyInput.value) || 1) - 1);
        qtyInput.value = v;
      });
      document.getElementById("qtyPlus")?.addEventListener("click", () => {
        const v = Math.min(maxQty, (Number(qtyInput.value) || 1) + 1);
        qtyInput.value = v;
      });
      document.getElementById("ppAddCart")?.addEventListener("click", () => {
        if (!available) return;
        if (colors.length && !selectedColor) {
          if (selLabel) { selLabel.textContent = "⚠️ لازم تختاري لون قبل الإضافة للسلة"; selLabel.style.color = "#f87171"; }
          alert("اختاري لون المنتج أولاً");
          return;
        }
        let qty = Math.max(1, Number(qtyInput?.value) || 1);
        if (stock > 0) qty = Math.min(qty, stock);
        const payload = Object.assign({}, p, { selectedColor, color: selectedColor });
        addLocalCart(payload, qty);
        const btn = document.getElementById("ppAddCart");
        if (btn) { btn.textContent = "تمت الإضافة ✓"; setTimeout(() => { btn.textContent = "أضف للسلة"; }, 1500); }
      });

    })();
  </script>

  <script>
    (async function(){
      try {
        const r = await fetch("/site-config.json?t="+Date.now(),{cache:"no-store"});
        if (!r.ok) return;
        const c = await r.json();
        const name = (c.siteName||"NEXORA").trim();
        const mark = (c.logoMark||name.slice(0,2)||"NX").toString().slice(0,3).toUpperCase();
        document.querySelectorAll("[data-site-name]").forEach(el=>el.textContent=name);
        document.querySelectorAll("[data-site-mark]").forEach(el=>el.textContent=mark);
        if (!location.search.includes("id=")) document.title = name;
        else if (document.title.includes("NEXORA")) document.title = document.title.replace(/NEXORA/g, name);
        const strong = document.querySelector(".pp-top strong");
        if (strong) strong.textContent = name;
      } catch(e){}
    })();
  </script>

</body>
</html>
